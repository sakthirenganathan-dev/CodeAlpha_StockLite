services:
  - type: web
    name: stock-portfolio-backend
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: CORS_ORIGINS
        value: https://your-portfolio-frontend.vercel.app,http://localhost:5173
      - key: ALLOW_ALL_CORS
        value: "false"
